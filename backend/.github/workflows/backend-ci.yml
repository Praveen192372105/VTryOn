name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint Suite (GPU-Free)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vtryon_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Bytecode Compilation Check
        working-directory: backend
        run: |
          python -m compileall app scripts tests

      - name: Database Migrations Check
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/vtryon_test
          APP_ENV: testing
          SECRET_KEY: test_super_secret_ci_key_minimum_32_characters_long
        run: |
          alembic upgrade head

      - name: Run Pytest Suite (Excluding GPU and Heavy AI Models)
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/vtryon_test
          REDIS_URL: redis://127.0.0.1:6379/0
          APP_ENV: testing
          SECRET_KEY: test_super_secret_ci_key_minimum_32_characters_long
        run: |
          pytest -m "not gpu and not ai_smoke" --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload Coverage to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7
