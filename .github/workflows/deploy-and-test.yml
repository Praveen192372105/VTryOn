name: Live Deployment & E2E Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Custom Live Base URL (default: GitHub Pages)'
        required: false
        default: 'https://eswarchinthakayala-fullstack.github.io/VTryOn/'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

env:
  DEFAULT_PAGES_URL: "https://eswarchinthakayala-fullstack.github.io/VTryOn/"

jobs:
  # ============================================================================
  # STAGES 1 - 5: BUILD & DEPLOY APPLICATION TO GITHUB PAGES
  # ============================================================================
  build-and-deploy:
    name: Build & Deploy Application
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url || env.DEFAULT_PAGES_URL }}
    steps:
      # Stage 1: Repository Checkout
      - name: "Stage 1: Repository Checkout"
        uses: actions/checkout@v4

      # Stage 2: Dependency Installation
      - name: "Stage 2: Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "web/package.json"

      - name: "Stage 2: Install Web Client Dependencies"
        working-directory: web
        run: npm install --frozen-lockfile || npm install

      # Stage 4: Static Analysis
      - name: "Stage 4: Static Analysis & Type Checking"
        working-directory: web
        run: |
          npm run typecheck || echo "::warning::Typecheck completed with warnings"

      # Stage 3: Build Application
      - name: "Stage 3: Build Web Application for GitHub Pages"
        working-directory: web
        env:
          GITHUB_PAGES: "true"
          VITE_BASE_PATH: "/VTryOn/"
        run: |
          npm run build
          # Enable SPA Deep Routing on GitHub Pages (copy index.html to 404.html)
          cp dist/index.html dist/404.html
          # Create .nojekyll to ensure Vite asset bundles starting with _ or special chars are served
          touch dist/.nojekyll
          # Deploy Standalone Test Reports & Dashboard Portal alongside web client
          mkdir -p dist/reports
          cp -r ../reports/* dist/reports/ || true
          cp ../reports/dashboard.html dist/dashboard.html || true
          cp ../reports/report.html dist/report.html || true
          cp ../reports/execution-report.html dist/execution-report.html || true

      # Stage 5: Deploy to GitHub Pages (Only on push to main or workflow_dispatch)
      - name: "Stage 5: Upload GitHub Pages Artifact"
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web/dist"

      - name: "Stage 5: Deploy to GitHub Pages"
        id: deploy-pages
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4

  # ============================================================================
  # STAGES 6 - 13: LIVE VERIFICATION & SELENIUM E2E AUTOMATION
  # ============================================================================
  e2e-live-testing:
    name: Live E2E Testing & Quality Gate
    needs: [build-and-deploy]
    if: success()
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "."
    steps:
      # Stage 1: Repository Checkout for Test Framework
      - name: "Stage 1: Checkout Repository"
        uses: actions/checkout@v4

      # Stage 2: Test Environment Dependencies
      - name: "Stage 2: Setup Python 3.12 Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Stage 2: Install Chrome & Selenium Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager openpyxl requests

      - name: "Stage 2: Verify Google Chrome Headless Browser"
        run: |
          google-chrome --version || which google-chrome

      # Stage 6: Wait for Deployment Propagation
      - name: "Stage 6: Wait for Live Deployment Propagation"
        run: |
          TARGET_URL="${{ github.event.inputs.base_url || env.DEFAULT_PAGES_URL }}"
          echo "Target Live URL: $TARGET_URL"
          echo "Awaiting HTTP 200 from live endpoint..."
          for i in {1..24}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "000")
            echo "Attempt $i: HTTP Status $HTTP_CODE"
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "Deployment is LIVE and responding!"
              break
            fi
            sleep 10
          done

      # Stage 7: Deployment Verification
      - name: "Stage 7: Comprehensive Deployment Verification"
        env:
          BASE_URL: ${{ github.event.inputs.base_url || env.DEFAULT_PAGES_URL }}
        run: |
          python automation/utils/verify_deployment.py

      # Stage 8: Run Selenium E2E Tests Against Live Deployment
      - name: "Stage 8: Execute 400+ Selenium E2E Tests Against LIVE Deployment"
        env:
          BASE_URL: ${{ github.event.inputs.base_url || env.DEFAULT_PAGES_URL }}
          HEADLESS: "true"
          ALLOW_LOCAL_SELENIUM: "false"
        run: |
          python automation/run_all_tests.py
          python scripts/generate_reports_portal.py || true

      # Stage 9 & 10: Reports Generated Automatically by Engine

      # Stage 11: Upload Artifacts (Retention: 30 Days)
      - name: "Stage 11: Upload All QA & Test Report Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-automation-reports
          path: |
            Test Results/
            reports/
          retention-days: 30
          if-no-files-found: error

      # Stage 12: Publish GitHub Actions Step Summary
      - name: "Stage 12: Publish Live Execution Summary to GitHub Actions"
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      # Stage 13: Store Historical Results Evidence
      - name: "Stage 13: Archive Historical Test Evidence"
        if: always()
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          mkdir -p "automation/history/$TIMESTAMP"
          cp -r "Test Results/JSON/" "automation/history/$TIMESTAMP/" || true
          cp -r "Test Results/Summary/" "automation/history/$TIMESTAMP/" || true
          echo "Historical snapshot archived for run $TIMESTAMP"
